name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deploy zur Zeit. Zwei parallele Laeufe koennten sich sonst gegenseitig
# ueberholen und eine aeltere Fassung als letzte veroeffentlichen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm ci statt npm install: nimmt exakt die Versionen aus dem Lockfile.
      # Sonst bricht der Build irgendwann von selbst, ohne dass sich etwas
      # am Projekt geaendert haette.
      - run: npm ci
      # Erst der Linter, dann die Tests, dann der Build - in dieser Reihenfolge,
      # weil der Linter in Sekunden meldet, was der Build erst am Ende faende.
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
